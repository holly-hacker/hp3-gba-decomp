groups:
  - name: WizardCrackerPopIt
    runs:
      - kind: graphic-blobs
        names: [WizardCrackerPopItBg1Graphic, WizardCrackerPopItBg0Graphic]
      # Palettes of the first four cracker kinds (g_aWizardCrackerPopItPalettes)
      - kind: image-bank
        count: 4
        names:
          1: WizardCrackerWrapped
          2: WizardCrackerTriangle
          3: WizardCrackerOval
          4: WizardCrackerDumbbell
        componentOrder: [palette]
        storedCells: false

  - name: WizardCrackerSprites
    runs:
      # The sweet cracker's palette, then the pop sprites and the sprites of the
      # cracker kinds (g_aWizardCrackerPopItPopAssets, g_aWizardCrackerPopItCrackerAssets)
      - kind: image-bank
        count: 9
        names:
          1: WizardCrackerSweet
          2: WizardCrackerTrianglePop
          3: WizardCrackerOvalPop
          4: WizardCrackerDumbbellPop
          5: WizardCrackerWrappedSprite
          6: WizardCrackerTriangleSprite
          7: WizardCrackerOvalSprite
          8: WizardCrackerDumbbellSprite
          9: WizardCrackerSweetSprite
        noPalette: [WizardCrackerSweetSprite]
      - kind: graphic-blobs
        names: [WizardCrackerPopItBg2Graphic]
