        names: [ServePumpkinJuiceBg0Graphic, ServePumpkinJuiceBg1Graphic, ServePumpkinJuiceBg2Graphic]

  # The 256-color palette whose colors the panel's palette effect cycles
  - name: ServePumpkinJuicePanel
